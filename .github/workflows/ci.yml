name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.85.0", "stable"]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust toolchain
        run: rustup toolchain install "${{ matrix.rust }}" --profile minimal
      - name: Install stable formatting and lint components
        if: matrix.rust == 'stable'
        run: rustup component add --toolchain stable rustfmt clippy
      - name: Format
        if: matrix.rust == 'stable'
        run: cargo +stable fmt --check
      - name: Test
        run: cargo +${{ matrix.rust }} test --locked --all-targets
      - name: Lint
        if: matrix.rust == 'stable'
        run: cargo +stable clippy --locked --all-targets --all-features -- -D warnings
